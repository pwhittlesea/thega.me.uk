{{ $tag := .Get "tag" }}
<section class="w-full grid gap-4 sm:grid-cols-2 md:grid-cols-3">
    {{ with .Site.RegularPages.ByPublishDate | collections.Reverse }}
        {{ range . }}
            {{ if collections.In .Params.tags $tag }}
                {{ partial "article-link/card.html" . }}
            {{ end }}
        {{ end }}
    {{ end }}
</section>
